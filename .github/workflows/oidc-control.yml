name: OIDC Control
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: mint and print non-secret claims
        run: |
          RESP=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=c218-probe")
          echo "OIDC-CONTROL-9Z2K mint-status=ok"
          python3 - "$RESP" <<'PY'
          import sys, json, base64
          d = json.loads(sys.argv[1])
          jwt = d["value"]
          p = jwt.split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          for k in ("sub","aud","repository","repository_owner","workflow","workflow_ref","job_workflow_ref","event_name","ref","runner_environment"):
              if k in c:
                  print("OIDC-CONTROL-9Z2K claim %s = %s" % (k, c[k]))
          PY
